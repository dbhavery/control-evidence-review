name: CI

on:
  push:
    branches: [master, main, dev]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install (dev extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run test suite
        run: python -m pytest -q

      - name: Run a sample review (deterministic clock)
        run: |
          python -m cer.cli review \
            --catalog controls/catalog.json \
            --evidence evidence \
            --out reports \
            --actor ci@example.com \
            --clock 2026-07-01T12:00:00Z

      # Scans every pattern family cer/redaction.py masks, not a fixed list of
      # literals, so the check cannot fall behind the redactor. --expect-redacted
      # makes an unmasked or empty run fail instead of passing vacuously.
      # --allow is the exact --actor id above, which the audit log records on
      # purpose; any other address in that family still fails the build.
      - name: Verify no synthetic secrets leaked into the report
        run: |
          python -m cer.leakcheck reports \
            --expect-redacted \
            --allow ci@example.com

      - name: Upload review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-report-py${{ matrix.python-version }}
          path: reports/
